<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kehidupan Bermasyarakat di Sekitarku - Petualangan Bangjack (Kelas IV)</title>
<style>
:root{--ink:#1f2a44;--sun:#ffc43d;--red:#e5484d;--blue:#2f6fed;--green:#2e9e48}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.5;color:var(--ink);min-height:100vh;background:linear-gradient(#8fd3f4,#d9f3ff 45%,#fff6d6 72%,#b9e5a0) fixed}
.hud{position:sticky;top:0;z-index:20;background:#1f4fbf;color:#fff;border-bottom:4px solid var(--sun)}
.hud>div{max-width:880px;margin:auto;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hud b{font-size:1rem}
.chip{background:#fff;color:var(--ink);border-radius:99px;padding:3px 11px;font-weight:800;font-size:.85rem;white-space:nowrap;display:inline-block}
.pbar{height:9px;background:#163a8c}.pbar i{display:block;height:100%;background:var(--sun);transition:width .5s}
main{max-width:880px;margin:auto;padding:14px 12px 60px}
.pg{animation:slide .38s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:24px;padding:16px;margin-bottom:14px;border:3px solid #fff;box-shadow:0 5px 0 rgba(31,42,68,.14)}
.c{text-align:center}
h1{font-size:2rem;margin:.1em 0;line-height:1.15}
h2{font-size:1.35rem;margin:.2em 0 .4em;line-height:1.25}
h3{font-size:1.05rem;margin:.2em 0}
.meta{font-size:.85rem;color:#5b6784;font-weight:700;margin-bottom:6px}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:12px 18px;min-height:48px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s;margin:4px 4px 4px 0}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.go{background:var(--green);color:#fff}.ghost{background:#e2e8f0;color:var(--ink)}.warn{background:var(--sun);color:var(--ink)}.red{background:var(--red);color:#fff}.big{font-size:1.2rem;padding:16px 22px}
:focus-visible{outline:4px solid #f97316;outline-offset:2px}
.say{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.bub{background:#eef6ff;border-radius:6px 20px 20px 20px;padding:8px 14px;flex:1;border:2px solid #cfe2ff}
.bub b{font-size:.8rem;color:var(--blue);display:block}.bub p{margin:0}
.jk{flex-shrink:0;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.ill{width:100%;height:auto;display:block;border-radius:18px;border:3px solid #dbeafe;margin:8px 0}
.tile{border-radius:16px;padding:10px 12px;background:#f1f7ff;border:2px solid #cfe2ff;margin:8px 0}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;background:#fff;border:3px solid #cbd5e1;border-radius:16px;padding:10px 14px;margin:8px 0;cursor:pointer;min-height:50px;align-items:center;transition:transform .12s,border-color .12s}
.opt b{background:#e2e8f0;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex-shrink:0}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(4px)}
.opt.ok{background:#dcfce7;border-color:var(--green);animation:pop .5s}
.opt.bad{background:#fee2e2;border-color:#dc2626;animation:shake .4s}
.fb{border-radius:14px;padding:8px 12px;margin:8px 0;font-size:.95rem}
.fb.ok{background:#dcfce7}.fb.bad{background:#fee2e2}.fb.info{background:#fef9c3}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dots{display:flex;gap:6px;margin:6px 0}.dots i{width:14px;height:14px;border-radius:50%;background:#e2e8f0;border:2px solid #cbd5e1}.dots i.d{background:var(--green);border-color:var(--green)}.dots i.x{background:var(--red);border-color:var(--red)}.dots i.n{border-color:var(--blue);transform:scale(1.25)}
input,select{font:inherit;padding:10px 12px;border-radius:12px;border:3px solid #cbd5e1;max-width:100%;background:#fff;width:100%}
label{font-weight:800;display:block;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.map{position:relative;max-width:420px;margin:auto}
.map svg{display:block;width:100%;height:auto;border-radius:26px;border:4px solid #fff;box-shadow:0 5px 0 rgba(31,42,68,.14)}
.node{position:absolute;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:var(--sun);font-size:30px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:bob 2.6s ease-in-out infinite;padding:0}
.node.dn{background:var(--green)}.node.lk{filter:grayscale(1);opacity:.65;cursor:not-allowed;animation:none}
.nl{position:absolute;transform:translate(-50%,0);font-size:.78rem;font-weight:800;text-align:center;background:#fff;border-radius:10px;padding:1px 8px;white-space:nowrap}
.mj{position:absolute;pointer-events:none}
.bigsc{font-size:3rem;font-weight:900;line-height:1}
.stars{font-size:2.2rem;letter-spacing:4px}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:100px;padding:8px;margin:4px;border-radius:16px;background:#fef3c7;font-size:.78rem;text-align:center;font-weight:800}.badge span{font-size:1.9rem}.badge.off{filter:grayscale(1);opacity:.45}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border:2px solid #cbd5e1;padding:6px 8px;text-align:left;vertical-align:middle}th{background:var(--blue);color:#fff}
.pb2{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden;min-width:70px}.pb2 i{display:block;height:100%;background:var(--green)}
.fx{position:fixed;top:-30px;font-size:28px;pointer-events:none;animation:fall 1.9s ease-in forwards;z-index:99}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.plus{position:fixed;left:50%;top:34%;transform:translateX(-50%);font-size:2.6rem;font-weight:900;color:#16a34a;text-shadow:0 2px 0 #fff,0 0 12px #fff;animation:rise 1.2s ease-out forwards;pointer-events:none;z-index:99}
@keyframes rise{to{transform:translate(-50%,-90px);opacity:0}}
.sc.pp{animation:pop .5s}
details{margin:10px 0;font-size:.9rem}pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:10px;overflow-x:auto;font-size:.78rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:480px){body{font-size:17px}h1{font-size:1.6rem}.btn{padding:10px 14px}}

/* ===== BERANDA BARU ===== */
.hero{padding:0;overflow:hidden;position:relative;background:linear-gradient(#8fd3f4 0%,#d9f3ff 62%,#fff6d6 88%);border-color:#fff}
.hero-top{padding:16px 12px 0;position:relative;z-index:2}
.logo{display:block;margin:0 auto 10px;width:min(250px,72%);height:auto;background:#fff;border-radius:18px;padding:6px 10px;border:3px solid #e3ebfb;box-shadow:0 4px 0 rgba(31,42,68,.16)}
.kick{display:inline-block;background:var(--sun);border-radius:99px;padding:3px 14px;font-weight:900;font-size:.82rem;letter-spacing:.04em;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.ttl{font-size:clamp(1.5rem,6.6vw,2.6rem);font-weight:900;line-height:1.1;margin:10px 0 4px;color:#1f4fbf;text-shadow:0 3px 0 #fff,0 5px 0 rgba(31,42,68,.18);letter-spacing:.01em}
.ttl em{font-style:normal;color:#e5484d;display:block}
.sub{margin:0;font-weight:800;color:#1f2a44}
.scene{display:block;width:100%;height:auto;margin-top:-4px;position:relative;z-index:1}
.nt{position:absolute;bottom:70px;font-size:1.7rem;opacity:0;animation:nrise 6s ease-in infinite;pointer-events:none;z-index:3}
@keyframes nrise{0%{transform:translateY(0) rotate(-10deg);opacity:0}15%{opacity:.95}100%{transform:translateY(-200px) rotate(16deg);opacity:0}}
.cl{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(36px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spn 18s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.wave{transform-box:fill-box;transform-origin:0 50%;animation:wv 1.3s ease-in-out infinite}
@keyframes wv{50%{transform:scaleX(.8) skewY(6deg)}}
.beat{transform-box:fill-box;transform-origin:50% 0;animation:bt 1.15s ease-in-out infinite}
@keyframes bt{50%{transform:rotate(5deg)}}
.beat2{transform-box:fill-box;transform-origin:50% 100%;animation:bp .58s ease-in-out infinite}
@keyframes bp{50%{transform:scale(1.07,.93)}}
.shk{transform-box:fill-box;transform-origin:50% 100%;animation:shk .45s ease-in-out infinite}
@keyframes shk{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px}
.chip2{background:#fff;border:2px solid #cfe2ff;border-radius:99px;padding:3px 12px;font-weight:800;font-size:.85rem}
.vid{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;border:4px solid #1f4fbf;background:#0f172a;margin:8px 0}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;background:#f1f7ff;border:2px solid #cfe2ff;border-radius:16px;padding:8px 12px;margin:8px 0}
.steps .n{flex:0 0 36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.steps .e{font-size:1.5rem;line-height:1.25}
.steps p{margin:0;font-size:.95rem}
.mbtn{position:fixed;right:12px;bottom:12px;z-index:30;border-radius:99px;padding:10px 16px;font-size:.95rem;margin:0}
.mbtn.pulse{animation:pls 1.6s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.08)}}
@media(max-width:480px){.nt{font-size:1.3rem}.steps .e{font-size:1.3rem}}
</style>
</head>
<body>
<div id="hud"></div>
<main id="app"></main>
<button id="mbtn" class="btn warn mbtn pulse" onclick="MUS.toggle()" aria-pressed="false">🎵 Putar Musik</button>
<script>
"use strict";
/* ==========================================================================
   KONFIGURASI
   1) Penyimpanan lokal (bawaan): nilai disimpan di browser perangkat ini saja.
   2) Firebase (opsional, nilai tersimpan daring): isi CFG.firebase di bawah.
      Petunjuk lengkap ada di halaman Login Guru (bagian "Petunjuk teknis").
   Mode lokal: sandi guru dibuat sendiri saat login pertama.
   ========================================================================== */
const CFG={firebase:{apiKey:"",authDomain:"",projectId:"",appId:""}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const h53=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507);a^=Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507);b^=Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fm=n=>String(Math.round(n*10)/10).replace(".",",");

/* ===== PENYIMPANAN ===== */
function lsGet(){try{return JSON.parse(localStorage.getItem("kp_hasil")||"{}")}catch(e){return{}}}
function lsSet(r){try{const o=lsGet();o[r.k]=r;localStorage.setItem("kp_hasil",JSON.stringify(o))}catch(e){}}
const DB={fb:null,note:"",un:null,uid:null,
 async init(){if(!CFG.firebase.apiKey)return;try{for(const f of["app","auth","firestore"])await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://www.gstatic.com/firebasejs/10.12.2/firebase-"+f+"-compat.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});firebase.initializeApp(CFG.firebase);const db=firebase.firestore();try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}DB.fb={auth:firebase.auth(),db}}catch(e){DB.fb=null;DB.note="Firebase gagal dimuat, jadi game memakai penyimpanan lokal."}},
 async anon(){const a=DB.fb.auth;if(!a.currentUser||!a.currentUser.isAnonymous)await a.signInAnonymously();return a.currentUser.uid},
 put(r){lsSet(r);if(DB.fb&&DB.uid)return DB.fb.db.collection("hasil").doc(DB.uid).set(Object.assign({},r,{k:DB.uid})).catch(()=>{});return Promise.resolve()},
 watch(ok,no){DB.stop();DB.un=DB.fb.db.collection("hasil").onSnapshot(q=>ok(q.docs.map(d=>d.data())),no)},
 stop(){if(DB.un){DB.un();DB.un=null}},
 async list(){if(DB.fb){const q=await DB.fb.db.collection("hasil").get();return q.docs.map(d=>d.data())}return Object.values(lsGet())},
 async clear(){if(DB.fb){const q=await DB.fb.db.collection("hasil").get();await Promise.all(q.docs.map(d=>d.ref.delete()))}else{try{localStorage.removeItem("kp_hasil")}catch(e){}}}
};

/* ===== KARAKTER: BANGJACK (satu-satunya karakter) ===== */
function jackG(e){
 const sk="#f2b27a",st='stroke="'+sk+'" stroke-width="8" stroke-linecap="round" fill="none"';
 let aL='<path d="M32 80Q18 94 24 104" '+st+'/>',aR='<path d="M68 80Q82 94 76 104" '+st+'/>',x="",eyes,mouth;
 if(e==="semangat"){aR='<path d="M68 80Q90 66 84 46" '+st+'/><circle cx="84" cy="41" r="7" fill="'+sk+'"/>'}
 if(e==="pikir"){aR='<path d="M68 82Q80 90 62 68" '+st+'/><circle cx="60" cy="66" r="6" fill="'+sk+'"/>';x='<text x="76" y="20" font-size="22" font-weight="900" fill="#2f6fed">?</text>'}
 if(e==="kaget"){aL='<path d="M32 80Q12 72 14 52" '+st+'/><circle cx="14" cy="48" r="7" fill="'+sk+'"/>';aR='<path d="M68 80Q88 72 86 52" '+st+'/><circle cx="86" cy="48" r="7" fill="'+sk+'"/>';x='<text x="44" y="12" font-size="22" font-weight="900" fill="#e5484d">!</text>'}
 eyes=e==="senang"?'<path d="M36 48Q41 42 46 48M54 48Q59 42 64 48" stroke="#1f2a44" stroke-width="3" fill="none" stroke-linecap="round"/>':e==="kaget"?'<circle cx="41" cy="48" r="6" fill="#fff" stroke="#1f2a44" stroke-width="2"/><circle cx="59" cy="48" r="6" fill="#fff" stroke="#1f2a44" stroke-width="2"/><circle cx="41" cy="48" r="2.5" fill="#1f2a44"/><circle cx="59" cy="48" r="2.5" fill="#1f2a44"/>':'<circle cx="41" cy="48" r="3.5" fill="#1f2a44"/><circle cx="59" cy="48" r="3.5" fill="#1f2a44"/>'+(e==="pikir"?'<path d="M54 39L65 36" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>':"");
 mouth=e==="kaget"?'<ellipse cx="50" cy="62" rx="4.5" ry="6" fill="#7f1d1d"/>':e==="pikir"?'<path d="M43 61Q50 58 57 62" stroke="#7f1d1d" stroke-width="3" fill="none" stroke-linecap="round"/>':e==="semangat"?'<path d="M40 56Q50 72 60 56Z" fill="#7f1d1d"/>':'<path d="M42 57Q50 66 58 57" stroke="#7f1d1d" stroke-width="3" fill="none" stroke-linecap="round"/>';
 return x+aL+aR+'<rect x="30" y="72" width="40" height="36" rx="10" fill="#2f6fed"/><rect x="46" y="72" width="8" height="36" fill="#fff"/><rect x="35" y="106" width="11" height="12" rx="3" fill="#1f2a44"/><rect x="54" y="106" width="11" height="12" rx="3" fill="#1f2a44"/><circle cx="24" cy="50" r="5" fill="'+sk+'"/><circle cx="76" cy="50" r="5" fill="'+sk+'"/><circle cx="50" cy="48" r="26" fill="'+sk+'"/><path d="M25 38L25 24Q50 10 75 24L75 38Q50 30 25 38Z" fill="#1f2937"/><rect x="25" y="33" width="50" height="4" fill="#fbbf24"/><circle cx="34" cy="58" r="4" fill="#f9a8a8" opacity=".7"/><circle cx="66" cy="58" r="4" fill="#f9a8a8" opacity=".7"/>'+eyes+mouth;
}
const jack=(e,w)=>'<svg class="jk" viewBox="0 0 100 120" width="'+w+'" height="'+Math.round(w*1.2)+'" role="img" aria-label="Bangjack">'+jackG(e)+'</svg>';
const bub=(e,t)=>'<div class="say">'+jack(e,64)+'<div class="bub"><b>Bangjack</b><p>'+t+'</p></div></div>';

/* ===== ILUSTRASI SVG ===== */
const SK=["#f2b27a","#c98b5a","#e0a070","#8d5a3b"];
const P=(x,y,c,k,ex)=>'<circle cx="'+x+'" cy="'+(y-27)+'" r="6" fill="'+SK[k%4]+'"/><path d="M'+(x-6)+' '+(y-28)+'A6 6 0 0 1 '+(x+6)+' '+(y-28)+'Z" fill="#2b2118"/><rect x="'+(x-6)+'" y="'+(y-20)+'" width="12" height="14" rx="4" fill="'+c+'"/><rect x="'+(x-5)+'" y="'+(y-7)+'" width="4" height="7" fill="#334155"/><rect x="'+(x+1)+'" y="'+(y-7)+'" width="4" height="7" fill="#334155"/>'+(ex||"");
const H=(x,y,c,s)=>'<g transform="translate('+x+','+y+') scale('+(s||1)+')"><rect y="-26" width="40" height="26" fill="'+c+'"/><polygon points="-4,-26 20,-44 44,-26" fill="#c2410c"/><rect x="16" y="-16" width="8" height="16" fill="#7c3f1d"/><rect x="4" y="-21" width="8" height="8" fill="#bfe9ff"/><rect x="28" y="-21" width="8" height="8" fill="#bfe9ff"/></g>';
const T=(x,y,t,s,c)=>'<text x="'+x+'" y="'+y+'" font-size="'+(s||11)+'" font-weight="800" text-anchor="middle" fill="'+(c||"#1f2a44")+'">'+t+'</text>';
const FG=(x,y)=>'<rect x="'+x+'" y="'+(y-26)+'" width="2" height="26" fill="#64748b"/><rect x="'+(x+2)+'" y="'+(y-26)+'" width="14" height="5" fill="#dc2626"/><rect x="'+(x+2)+'" y="'+(y-21)+'" width="14" height="5" fill="#fff" stroke="#cbd5e1" stroke-width=".5"/>';
const ill=(alt,body,night)=>'<svg class="ill" viewBox="0 0 300 150" role="img" aria-label="'+alt+'"><rect width="300" height="150" fill="'+(night?"#1e2a5a":"#bfe9ff")+'"/>'+(night?'<circle cx="250" cy="28" r="14" fill="#fef3c7"/><circle cx="40" cy="20" r="1.5" fill="#fff"/><circle cx="120" cy="34" r="1.5" fill="#fff"/><circle cx="190" cy="16" r="1.5" fill="#fff"/>':'<circle cx="262" cy="30" r="16" fill="#ffd54a"/><ellipse cx="70" cy="30" rx="26" ry="9" fill="#fff"/><ellipse cx="92" cy="25" rx="18" ry="8" fill="#fff"/>')+'<rect y="118" width="300" height="32" fill="'+(night?"#2f6b3c":"#4cb050")+'"/>'+body+'</svg>';
const KEC='<rect x="222" y="62" width="70" height="56" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="216" y="56" width="82" height="8" fill="#1d4ed8"/><rect x="230" y="74" width="7" height="44" fill="#93c5fd"/><rect x="274" y="74" width="7" height="44" fill="#93c5fd"/><rect x="246" y="94" width="12" height="24" fill="#7c3f1d"/>'+FG(252,56);
const SC={

 peta:()=>{const cur=[1,2,3].find(l=>!lvDone(l)),pos=[[25,82],[72,60],[28,36],[70,14]],tp=allDone()?3:cur-1,jx=pos[tp][0];

 lvdone:()=>{const l=V.p.l,s=lvStars(l),qs=qsOf(l),nx=l<3?"go('materi',{l:"+(l+1)+",i:0})":"go('hasil')";
  return '<div class="card c"><div class="bigsc">'+L[l-1].ic+'</div><h2>Level '+l+' selesai: '+L[l-1].nm+'</h2><div class="stars">'+"⭐".repeat(s)+"☆".repeat(3-s)+'</div>'+bub(s===3?"kaget":s===2?"senang":"semangat",s===3?"Wow, bintang tiga! Kamu hebat sekali!":s===2?"Bagus! Dua bintang untukmu.":"Kamu sudah menyelesaikan level ini. Baca materinya lagi untuk bintang lebih banyak!")+'<div class="wrap"><table><tr><th>Soal</th><th>Perolehan</th></tr>'+qs.map((q,k)=>'<tr><td>'+(k+1)+'. '+esc(q.q)+'</td><td>'+fm(got(q))+' / '+q.w+'</td></tr>').join("")+'</table></div><p><button class="btn ghost" onclick="go(\'peta\')">🗺️ Peta</button><button class="btn go" onclick="'+nx+'">'+(l<3?"Level berikutnya ▶":"Lihat rapor 🏆")+'</button></p></div>'},
 hasil:()=>{const n=nilai(),c=cat(n),b=Q.filter(q=>got(q)===q.w).length;if(!allDone())return '<div class="card c">'+bub("pikir","Selesaikan semua level dulu ya, baru rapor terbuka.")+'<button class="btn go" onclick="go(\'peta\')">Ke peta</button></div>';
  return '<div class="card c"><div class="bigsc">'+(n>=90?"🏆":n>=80?"🥇":n>=70?"💪":"📚")+'</div><h2>'+c.t+'</h2><div class="bigsc">'+fm(n)+'</div><p>Skor perolehan <b>'+fm(score())+'</b> dari skor maksimal <b>'+maxs()+'</b><br>Nilai Akhir = ('+fm(score())+' ÷ '+maxs()+') × 100 = <b>'+fm(n)+'</b></p>'+bub(c.e,c.m)+'</div><div class="card"><h2>Rapor Petualangan: '+esc(S.nama)+' ('+esc(S.kode)+')</h2><p>Jawaban benar penuh: <b>'+b+'</b> | Belum tepat: <b>'+(Q.length-b)+'</b></p><div class="wrap"><table><tr><th>Level</th><th>Soal</th><th>Maks</th><th>Perolehan</th><th>Bintang</th></tr>'+[1,2,3].map(l=>'<tr><td>'+L[l-1].nm+'</td><td>'+qsOf(l).length+'</td><td>'+qsOf(l).reduce((s,q)=>s+q.w,0)+'</td><td>'+fm(qsOf(l).reduce((s,q)=>s+got(q),0))+'</td><td>'+"⭐".repeat(lvStars(l))+'</td></tr>').join("")+'<tr><th colspan="2">Total</th><th>'+maxs()+'</th><th>'+fm(score())+'</th><th></th></tr></table></div><p class="meta">Aturan nilai: tiap soal bernilai 10 poin. Jawaban benar mendapat poin penuh, jawaban salah 0 poin. Soal mencocokkan dan menyusun urutan mendapat poin sebagian sesuai jumlah yang benar.</p><h3>Lencanamu</h3>'+badges().map(x=>'<div class="badge '+(x[2]?"":"off")+'"><span>'+x[0]+'</span>'+x[1]+'</div>').join("")+'<p><button class="btn warn" onclick="ulang()">🔄 Main lagi</button><button class="btn ghost" onclick="keluar()">🏠 Selesai dan keluar</button></p></div>'},
 dash:()=>{const R=V.p.rows;if(!R)return '<div class="card c">Memuat data nilai...</div>';
  const f=V.p.f||"",ks=[...new Set(R.map(r=>r.kode))].sort(),D=R.filter(r=>!f||r.kode===f).sort((a,b)=>a.kode.localeCompare(b.kode)||a.nama.localeCompare(b.nama)),dn=D.filter(r=>r.status==="Selesai"),av=dn.length?Math.round(dn.reduce((s,r)=>s+r.nilai,0)/dn.length*10)/10:0;

  '<div class="wrap"><table><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Skor</th><th>Benar</th><th>Salah</th><th>Progres</th><th>Status</th><th>Detail</th></tr>'+(D.length?D.map((r,k)=>'<tr><td>'+(k+1)+'</td><td>'+esc(r.nama)+'</td><td>'+esc(r.kode)+'</td><td><b>'+fm(r.skor)+'</b>/'+r.maks+'</td><td>'+r.benar+'</td><td>'+r.salah+'</td><td><div class="pb2"><i style="width:'+r.prog+'%"></i></div>'+r.prog+'%</td><td>'+esc(r.status)+'</td><td><button class="btn ghost" style="min-height:36px;padding:4px 10px;margin:0" onclick="go(\'detail\',{k:\''+esc(r.k)+'\'})">Lihat</button></td></tr>').join(""):'<tr><td colspan="9">Belum ada siswa yang bermain.</td></tr>')+'</table></div><p class="meta">Benar dihitung jika soal dijawab dengan poin penuh. Salah mencakup jawaban yang belum tepat atau sebagian benar.</p></div>'},
 detail:()=>{const r=ROWS.find(x=>x.k===V.p.k);if(!r)return '<div class="card">Data tidak ditemukan. <button class="btn ghost" onclick="go(\'dash\')">Kembali</button></div>';

/* ===== AKSI ===== */
function err(t){const e=$("#er");e.textContent=t;e.hidden=false}
async function mulai(){const n=$("#nm").value.trim().replace(/\s+/g," "),k=$("#kd").value.trim().toUpperCase().replace(/\s+/g,"");
 if(n.length<2)return err("Tulis namamu dulu, minimal 2 huruf ya.");if(k.length<2)return err("Tulis kode kelasmu dulu ya.");
 S={role:"siswa",guru:false,nama:n,kode:k,ans:{},tmp:{},fail:0,until:0,pop:false};
 if(DB.fb){try{DB.uid=await DB.anon()}catch(e){DB.uid=null;alert("Koneksi ke server belum aktif. Nilaimu tersimpan di perangkat ini dulu.")}}
 const k0=keyOf(),ses=loadSes(k0);let back=false;
 if(ses&&ses.ans&&Object.keys(ses.ans).length){S.ans=ses.ans;S.tmp=ses.tmp||{};back=true}
 else{const old=lsGet()[k0];if(old&&old.det){Object.keys(old.det).forEach(id=>{const q=Qb(+id);if(q)S.ans[q.id]={p:old.det[id],sel:-1,e:old.det[id]===q.w?"senang":"pikir",m:"Jawabanmu tadi sudah tersimpan."}});back=Object.keys(S.ans).length>0}}
 save();burst(10);
 const r=back?resumePos(ses):null;go(...(r||["peta"]));if(back)plus("Selamat datang kembali! 👋")}
function ulang(){S.ans={};S.tmp={};save();go("peta")}
async function masuk(){if(Date.now()<S.until)return err("Terlalu banyak percobaan. Tunggu 30 detik.");
 const pw=$("#pw").value;let ok=false;
 try{if(DB.fb){await DB.fb.auth.signInWithEmailAndPassword($("#em").value.trim(),pw);ok=true}else{let s=null;try{s=localStorage.getItem("kp_pw")}catch(e){}if(!s){if(pw.length<6)return err("Buat sandi baru, minimal 6 karakter.");try{localStorage.setItem("kp_pw",h53("kp:"+pw))}catch(e){}ok=true}else ok=h53("kp:"+pw)===s}}catch(e){ok=false}
 if(!ok){if(++S.fail>=5){S.until=Date.now()+30000;S.fail=0}return err(DB.fb?"Email atau sandi salah.":"Sandi salah.")}
 S.role="guru";S.guru=true;go("dash")}
function gantiSandi(){const p=prompt("Sandi baru (minimal 6 karakter):");if(!p)return;if(p.length<6)return alert("Sandi terlalu pendek.");try{localStorage.setItem("kp_pw",h53("kp:"+p));alert("Sandi diganti. Catatan: sandi ini hanya berlaku di browser ini.")}catch(e){alert("Gagal menyimpan sandi.")}}
function hapusSemua(){if(confirm("Hapus SEMUA data nilai siswa? Tindakan ini tidak dapat dibatalkan."))DB.clear().then(()=>{V.p.rows=null;render(1)})}
function csv(){const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'},f=V.p.f||"";
 const rows=(V.p.rows||[]).filter(r=>!f||r.kode===f).map(r=>[r.nama,r.kode,r.skor,r.maks,r.nilai,r.benar,r.salah,r.prog,r.status,r.t].map(q).join(","));
 const b=new Blob(["\ufeff"+["Nama","Kelas","Skor","Skor Maks","Nilai","Benar","Salah","Progres (%)","Status","Waktu"].map(q).join(",")+"\n"+rows.join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="rekap-nilai-kampung-pancasila.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function fin(q,p,sel){const full=p===q.w;S.ans[q.id]={p,sel,e:full?pick(["senang","semangat"]):p>0?"semangat":"pikir",m:full?pick(["Hebat! Jawabanmu benar!","Keren! Kamu pintar sekali!","Tepat sekali, teman!"]):p>0?"Lumayan! Sebagian jawabanmu sudah benar.":"Belum tepat. Ayo coba lagi di soal berikutnya!"};
 if(p>0){plus("+"+fm(p));burst(full?16:6);S.pop=true}save();render(1)}
function pk(id,j){const q=Qb(id);if(S.ans[q.id])return;fin(q,j===q.a?q.w:0,j)}
function tm(id,k,v){S.tmp[id][k]=v;const q=Qb(id);$("#chk").disabled=!q.pairs.every((p,i)=>S.tmp[id][i])}
function od(id,v){const t=S.tmp[id]||(S.tmp[id]=[]);if(t.length<4&&t.indexOf(v)<0)t.push(v);render(1)}

/* ===== MUSIK LATAR (dibuat langsung oleh browser, tanpa file audio) ===== */
const MUS={ctx:null,m:null,nb:null,on:false,ever:false,tm:null,st:0,nt:0,wasOn:false,BPM:104,
 F:[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880],
 MEL:[5,-1,7,8,7,-1,5,-1, 6,-1,8,9,8,-1,6,-1, 4,-1,5,6,5,-1,4,-1, 5,6,7,-1,6,5,3,-1, 5,-1,7,8,9,-1,8,7, 8,-1,7,6,7,-1,5,-1, 6,7,8,-1,7,6,5,-1, 5,-1,3,-1,5,-1,-1,-1],
 ROOT:[130.81,98,110,87.31,130.81,98,87.31,130.81],
 start(){try{
  if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=this.ctx=new A(),k=c.createDynamicsCompressor(),g=c.createGain();g.gain.value=.5;g.connect(k);k.connect(c.destination);this.m=g;
   const b=this.nb=c.createBuffer(1,Math.floor(c.sampleRate*.5),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  this.ctx.resume();this.ever=true;
  if(!this.on){this.on=true;this.st=0;this.nt=this.ctx.currentTime+.08;this.tm=setInterval(()=>this.tick(),60)}
  document.body.classList.add("mon")}catch(e){}this.ui()},
 stop(){this.on=false;clearInterval(this.tm);this.tm=null;document.body.classList.remove("mon");this.ui()},
 toggle(){this.on?this.stop():this.start()},
 ui(){const b=document.getElementById("mbtn");if(!b)return;b.textContent=this.on?"🎵 Musik: Nyala":this.ever?"🔇 Musik: Mati":"🎵 Putar Musik";b.setAttribute("aria-pressed",String(this.on));b.classList.toggle("pulse",!this.ever)},
 tick(){const c=this.ctx;while(this.nt<c.currentTime+.25){this.play(this.st%64,this.nt);this.nt+=60/this.BPM/2;this.st++}},
 play(s,t){const b=s%8,bar=s>>3,n=this.MEL[s];
  if(n>=0){this.pluck(this.F[n],t,.3,.18);this.pluck(this.F[n],t+.13,.12,.08)}
  if(b===0||b===4){this.bass(this.ROOT[bar],t,1);this.kick(t)}
  if(b===2||b===6){this.bass(this.ROOT[bar]*1.5,t,.55);this.block(t)}
  this.hat(t,b%2?.6:.3)},
 env(o,t,v,d){const g=this.ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+.05)},
 osc(ty,f,t,v,d){const o=this.ctx.createOscillator();o.type=ty;o.frequency.value=f;this.env(o,t,v,d)},
 pluck(f,t,v,d){this.osc("triangle",f,t,v,d+.35);this.osc("sine",f*2,t,v*.35,d+.2)},
 bass(f,t,k){this.osc("sine",f,t,.55*k,.32);this.osc("triangle",f*2,t,.12*k,.2)},
 kick(t){const o=this.ctx.createOscillator();o.type="sine";o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);this.env(o,t,.7,.2)},
 block(t){this.osc("triangle",950,t,.16,.07)},
 hat(t,v){const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;f.type="highpass";f.frequency.value=7000;g.gain.setValueAtTime(.07*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(f);f.connect(g);g.connect(this.m);s.start(t);s.stop(t+.06)}
};
function firstTap(e){if(MUS.ever)return;if(e.target&&e.target.closest&&e.target.closest("#mbtn"))return;MUS.start()}
document.addEventListener("click",firstTap,true);
document.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")firstTap(e)},true);
document.addEventListener("visibilitychange",()=>{if(document.hidden){MUS.wasOn=MUS.on;if(MUS.on)MUS.stop()}else if(MUS.wasOn){MUS.wasOn=false;MUS.start()}});
window.addEventListener("blur",()=>setTimeout(()=>{const a=document.activeElement;if(a&&a.tagName==="IFRAME"&&MUS.on)MUS.stop()},0));

DB.init().then(()=>render());
