  <body>
    <div id="hud"></div>
    <main id="app"></main>
    <button
      id="mbtn"
      class="btn warn mbtn pulse"
      onclick="MUS.toggle()"
      aria-pressed="false"
    >
      🎵 Putar Musik
    </button>
    <script>
      "use strict";
      /* ==========================================================================
   KONFIGURASI
   Supabase: isi projectUrl dan publishableKey di bawah.
   Gunakan publishable key saja. Jangan pernah menaruh sb_secret/service_role di HTML.
   ========================================================================== */
      const CFG = {
        supabase: {
          projectUrl: "https://qhmbtwlublxofbcwfepc.supabase.co",
          publishableKey: "sb_publishable_czskFOfbRvZbsCXaPQ_GNQ_PXwb2Zxm",
        },
      };
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const h53 = (s) => {
        let a = 0xdeadbeef,
          b = 0x41c6ce57;
        for (let i = 0; i < s.length; i++) {
          const c = s.charCodeAt(i);
          a = Math.imul(a ^ c, 2654435761);
          b = Math.imul(b ^ c, 1597334677);
        }
        a = Math.imul(a ^ (a >>> 16), 2246822507);
        a ^= Math.imul(b ^ (b >>> 13), 3266489909);
        b = Math.imul(b ^ (b >>> 16), 2246822507);
        b ^= Math.imul(a ^ (a >>> 13), 3266489909);
        return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36);
      };
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      const fm = (n) => String(Math.round(n * 10) / 10).replace(".", ",");

      /* ===== PENYIMPANAN SUPABASE ===== */
      function lsGet() {
        try {
          return JSON.parse(localStorage.getItem("kp_hasil") || "{}");
        } catch (e) {
          return {};
        }
      }
      function lsSet(r) {
        try {
          const o = lsGet();
          o[r.k] = r;
          localStorage.setItem("kp_hasil", JSON.stringify(o));
        } catch (e) {}
      }
      const DB = {
        sb: null,
        note: "",
        un: null,
        uid: null,
        async init() {
          const c = CFG.supabase;
          if (
            !c.projectUrl ||
            c.projectUrl.includes("ISI_PROJECT_URL") ||
            !c.publishableKey
          ) {
            DB.note =
              "Isi Project URL Supabase pada CFG.supabase agar data tersimpan online.";
            return;
          }
          try {
            await new Promise((ok, no) => {
              const s = document.createElement("script");
              s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
              s.onload = ok;
              s.onerror = no;
              document.head.appendChild(s);
            });
            DB.sb = window.supabase.createClient(
              c.projectUrl,
              c.publishableKey,
            );
          } catch (e) {
            DB.note = "Supabase gagal dimuat. Periksa koneksi dan konfigurasi.";
          }
        },
        async anon() {
          const { data, error } = await DB.sb.auth.getSession();
          if (error) throw error;
          let u = data.session?.user;
          if (!u || !u.is_anonymous) {
            const r = await DB.sb.auth.signInAnonymously();
            if (r.error) throw r.error;
            u = r.data.user;
          }
          return u.id;
        },
        async put(r) {
          lsSet(r);

          if (!DB.sb || !DB.uid) {
            console.warn(
              "Supabase belum terhubung atau UID siswa belum tersedia.",
            );
            return false;
          }

          const row = {
            user_id: DB.uid,
            nama_siswa: r.nama,
            kelas: r.kode,
            nilai: r.nilai,
            skor: r.skor,
            maks: r.maks,
            benar: r.benar,
            salah: r.salah,
            jawab: r.jawab,
            prog: r.prog,
            status: r.status,
            detail_jawaban: r.det,
            created_at: r.t,
          };

          const { error } = await DB.sb
            .from("hasil_kuis")
            .upsert(row, { onConflict: "user_id" });

          if (error) {
            console.error("Gagal menyimpan hasil siswa:", error);
            return false;
          }

          console.log("Hasil siswa berhasil disimpan ke Supabase.");
          return true;
        },
        async watch(ok, no) {
          DB.stop();
          const load = async () => {
            const { data, error } = await DB.sb
              .from("hasil_kuis")
              .select(
                "user_id,nama_siswa,kelas,nilai,skor,maks,benar,salah,jawab,prog,status,detail_jawaban,created_at",
              )
              .order("created_at", { ascending: false });
            if (error) throw error;
            ok(
              (data || []).map((x) => ({
                k: x.user_id,
                nama: x.nama_siswa,
                kode: x.kelas,
                nilai: Number(x.nilai || 0),
                skor: Number(x.skor || 0),
                maks: Number(x.maks || 0),

      /* ===== AKSI ===== */
      function err(t) {
        const e = $("#er");
        e.textContent = t;
        e.hidden = false;
      }
      async function mulai() {
        const n = $("#nm").value.trim().replace(/\s+/g, " "),
          k = $("#kd").value.trim().toUpperCase().replace(/\s+/g, "");
        if (n.length < 2) return err("Tulis namamu dulu, minimal 2 huruf ya.");
        if (k.length < 2) return err("Tulis kode kelasmu dulu ya.");
        S = {
          role: "siswa",
          guru: false,
          nama: n,
          kode: k,
          ans: {},
          tmp: {},
          fail: 0,
          until: 0,
          pop: false,
        };
        if (DB.sb) {
          try {
            DB.uid = await DB.anon();
          } catch (e) {
            DB.uid = null;
            alert(
              "Koneksi ke server belum aktif. Nilaimu tersimpan di perangkat ini dulu.",
            );
          }
        }
        const k0 = keyOf(),
          ses = loadSes(k0);
        let back = false;
        if (ses && ses.ans && Object.keys(ses.ans).length) {
          S.ans = ses.ans;
          S.tmp = ses.tmp || {};
          back = true;
        } else {
          const old = lsGet()[k0];
          if (old && old.det) {
            Object.keys(old.det).forEach((id) => {
              const q = Qb(+id);
              if (q)
                S.ans[q.id] = {
                  p: old.det[id],
                  sel: -1,
                  e: old.det[id] === q.w ? "senang" : "pikir",
                  m: "Jawabanmu tadi sudah tersimpan.",
                };
            });
            back = Object.keys(S.ans).length > 0;
          }
        }
        save();
        burst(10);
        const r = back ? resumePos(ses) : null;
        go(...(r || ["peta"]));
        if (back) plus("Selamat datang kembali! 👋");
      }
      function ulang() {
        S.ans = {};
        S.tmp = {};
        save();
        go("peta");
      }
      async function masuk() {
        if (Date.now() < S.until)
          return err("Terlalu banyak percobaan. Tunggu 30 detik.");
        const pw = $("#pw").value;
        let ok = false;
        try {
          if (DB.sb) {
            const { data, error } = await DB.sb.auth.signInWithPassword({
              email: $("#em").value.trim(),
              password: pw,
            });
            if (error) throw error;
            const check = await DB.sb
              .from("guru_access")
              .select("user_id")
              .eq("user_id", data.user.id)
              .maybeSingle();
            if (check.error || !check.data)
              throw new Error("Akun ini belum diberi akses guru.");
            ok = true;
          } else {
            let s = null;
            try {
              s = localStorage.getItem("kp_pw");
            } catch (e) {}
            if (!s) {
              if (pw.length < 6)
                return err("Buat sandi baru, minimal 6 karakter.");
              try {
                localStorage.setItem("kp_pw", h53("kp:" + pw));
              } catch (e) {}
              ok = true;
            } else ok = h53("kp:" + pw) === s;
          }
        } catch (e) {
          ok = false;
        }
        if (!ok) {
          if (++S.fail >= 5) {
            S.until = Date.now() + 30000;
            S.fail = 0;
          }
          return err(
            DB.sb
              ? "Email/sandi salah atau akun belum terdaftar sebagai guru."
              : "Sandi salah.",
          );
        }
        S.role = "guru";
        S.guru = true;
        go("dash");
      }
      function gantiSandi() {
        const p = prompt("Sandi baru (minimal 6 karakter):");
        if (!p) return;
        if (p.length < 6) return alert("Sandi terlalu pendek.");
        try {
          localStorage.setItem("kp_pw", h53("kp:" + p));
          alert(
            "Sandi diganti. Catatan: sandi ini hanya berlaku di browser ini.",
          );
        } catch (e) {
          alert("Gagal menyimpan sandi.");
        }
      }
      async function hapusSemua() {
        if (
          !confirm(
            "Hapus SEMUA data nilai siswa? Tindakan ini tidak dapat dibatalkan.",
          )
        )
          return;

        try {
          await DB.clear();
          alert("Data siswa berhasil dihapus.");
          V.p.rows = null;
          render(1);
        } catch (e) {
          console.error("Gagal menghapus data:", e);
          alert("Gagal menghapus data: " + (e.message || e));
        }
      }
      function csv() {
        const q = (v) => {
            v = String(v);
            if (/^[=+\-@]/.test(v)) v = "'" + v;
            return '"' + v.replace(/"/g, '""') + '"';
          },
          f = V.p.f || "";
        const rows = (V.p.rows || [])
          .filter((r) => !f || r.kode === f)
          .map((r) =>
            [
              r.nama,
              r.kode,
              r.skor,
              r.maks,
              r.nilai,
              r.benar,
              r.salah,
              r.prog,
              r.status,
              r.t,
            ]
              .map(q)
              .join(","),
          );
        const b = new Blob(
            [
              "\ufeff" +
                [
                  "Nama",
                  "Kelas",
                  "Skor",
                  "Skor Maks",
                  "Nilai",
                  "Benar",
                  "Salah",
                  "Progres (%)",
                  "Status",
                  "Waktu",
                ]
                  .map(q)
                  .join(",") +
                "\n" +
                rows.join("\n"),
            ],
            { type: "text/csv" },
          ),
          a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = "rekap-nilai-kampung-pancasila.csv";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }
      function fin(q, p, sel) {
        const full = p === q.w;
        S.ans[q.id] = {
          p,
          sel,
          e: full ? pick(["senang", "semangat"]) : p > 0 ? "semangat" : "pikir",
          m: full
            ? pick([
                "Hebat! Jawabanmu benar!",
                "Keren! Kamu pintar sekali!",
                "Tepat sekali, teman!",
              ])
            : p > 0
              ? "Lumayan! Sebagian jawabanmu sudah benar."
              : "Belum tepat. Ayo coba lagi di soal berikutnya!",
        };
        if (p > 0) {
          plus("+" + fm(p));
          burst(full ? 16 : 6);
          S.pop = true;
        }
        save();
        render(1);
      }
      function pk(id, j) {
        const q = Qb(id);
        if (S.ans[q.id]) return;
        fin(q, j === q.a ? q.w : 0, j);
      }
      function tm(id, k, v) {
        S.tmp[id][k] = v;
        const q = Qb(id);
        $("#chk").disabled = !q.pairs.every((p, i) => S.tmp[id][i]);
      }
      function od(id, v) {
        const t = S.tmp[id] || (S.tmp[id] = []);
        if (t.length < 4 && t.indexOf(v) < 0) t.push(v);
        render(1);
      }
      function ck(id) {
        const q = Qb(id),
          t = S.tmp[id] || [];
        if (S.ans[id]) return;
        const c =
          q.type === "match"
            ? q.pairs.filter((p, k) => t[k] === p[1]).length
            : q.ord.filter((x, k) => t[k] === x).length;
        fin(q, (c * q.w) / 4, 0);
      }

            '<line x1="-6" y1="-22" x2="-28" y2="-2" stroke="#7c3f1d" stroke-width="3"/><path d="M-24 -4L-34 2L-22 4Z" fill="#d97706"/>',
            0.6,
          ) +
          /* Anak bermain angklung */
          pp(166, 318, "#16a34a", 3, 1.45, "", 0.3) +
          '<g class="shk"><g transform="translate(180,278)"><rect x="0" y="0" width="3" height="30" rx="1.5" fill="#92400e"/><rect x="0" y="27" width="22" height="3" rx="1.5" fill="#92400e"/><rect x="5" y="2" width="4" height="25" rx="2" fill="#e0b84a"/><rect x="11" y="8" width="4" height="19" rx="2" fill="#d4a62e"/><rect x="17" y="14" width="4" height="13" rx="2" fill="#c8961a"/></g></g>' +
          /* Bangjack */
          '<g transform="translate(222,140) scale(1.5)"><g class="jk">' +
          jackG("semangat") +
          "</g></g>" +
          /* Gong */
          '<g transform="translate(404,318)"><rect x="-4" y="-66" width="5" height="66" rx="2" fill="#92400e"/><rect x="42" y="-66" width="5" height="66" rx="2" fill="#92400e"/><rect x="-6" y="-68" width="55" height="6" rx="3" fill="#7c3f1d"/><line x1="21" y1="-62" x2="21" y2="-56" stroke="#7c3f1d" stroke-width="2"/><g class="beat"><circle cx="21" cy="-38" r="18" fill="#f5b82e" stroke="#b7791f" stroke-width="3"/><circle cx="21" cy="-38" r="7" fill="#d99a14"/><circle cx="21" cy="-38" r="12" fill="none" stroke="#e8a81c" stroke-width="1.5"/></g></g>' +
          /* Kendang */
          '<g transform="translate(468,320)"><g class="beat2"><path d="M-12 -30Q-19 -15 -12 0L12 0Q19 -15 12 -30Z" fill="#b45309"/><ellipse cx="0" cy="-30" rx="12" ry="4.5" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="12" ry="3.5" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><path d="M-13 -22L13 -10M-13 -10L13 -22" stroke="#fde68a" stroke-width="1.6"/></g></g>' +
          /* Warga bergandengan tangan */
          '<line x1="522" y1="302" x2="560" y2="302" stroke="#c98b5a" stroke-width="4" stroke-linecap="round"/>' +
          pp(516, 322, "#ec4899", 2, 1.45, "", 0.2) +
          pp(566, 322, "#f59e0b", 0, 1.45, "", 0.8) +
          T(541, 276, "\u2764", 20, "#e5484d") +
          "</svg>"
        );
      }
      function gateHTML() {
        const nt = [
          ["8%", "♪", "#e5484d", "0s"],
          ["22%", "♫", "#2f6fed", "1.6s"],
          ["38%", "♪", "#2e9e48", "3.1s"],
          ["58%", "♫", "#f59e0b", "0.8s"],
          ["74%", "♪", "#8b5cf6", "2.4s"],
          ["90%", "♫", "#ec4899", "4.2s"],
        ]
          .map(
            (n) =>
              '<span class="nt" aria-hidden="true" style="left:' +
              n[0] +
              ";color:" +
              n[2] +
              ";animation-delay:" +
              n[3] +
              '">' +
              n[1] +
              "</span>",
          )
          .join("");
        const chips = [
          "🏛️ Desentralisasi",
          "🏠 RT dan RW",
          "🤝 Gotong royong",
          "💬 Musyawarah",
          "🌈 Rukun dalam keragaman",
        ]
          .map((t) => '<span class="chip2">' + t + "</span>")
          .join("");
        const trip = L.map(
          (l) =>
            '<div class="tile c"><div style="font-size:1.9rem">' +
            l.ic +
            "</div><b>" +
            l.nm +
            '</b><br><span class="meta">' +
            l.sub +
            "</span></div>",
        ).join("");
        const st = [
          [
            "🎬",
            "Tonton kedua videonya dulu",
            "Video 1 adalah animasi dengan pesan moral, Video 2 menjelaskan materi. Tekan tombol ▶ pada video untuk memutar. Matikan musik dengan tombol 🎵 saat menonton supaya suaranya jelas.",
          ],
          [
            "🎒",
            "Pilih Mode Siswa",
            "Tulis namamu dan kode kelas dari Bapak atau Ibu Guru, lalu tekan Mulai Petualangan.",
          ],
          [
            "🗺️",
            "Jelajahi peta kampung",
            "Ada 3 tempat. Buka satu per satu dari Gerbang Kampung. Tempat berikutnya terbuka setelah soal sebelumnya selesai.",
          ],
          [
            "📖",
            "Baca materi bersama Bangjack",
            "Baca pelan-pelan, lalu kerjakan soalnya. Ingat tips dari Bangjack ya!",
          ],
          [
            "✅",
            "Pilih jawaban dengan teliti",
            "Jawaban yang sudah dipilih tidak bisa diganti. Penjelasan muncul setelah kamu menjawab.",
          ],
          [
            "⭐",
            "Kumpulkan koin, bintang, dan lencana",
            "Boleh keluar kapan saja, progresmu tersimpan. Masuk lagi dengan nama dan kode kelas yang sama untuk lanjut dari terakhir.",
          ],
        ]
          .map(
            (s, i) =>
              '<li><span class="n">' +
              (i + 1) +
              '</span><span class="e" aria-hidden="true">' +
              s[0] +
              "</span><div><b>" +
              s[1] +
              "</b><p>" +
              s[2] +
              "</p></div></li>",
          )
          .join("");
        return (
          '<div class="card c hero">' +
          nt +
          '<div class="hero-top"><img class="logo" src="' +
          LOGO +
          '" alt="Logo Jurusan PGSD Universitas Negeri Makassar"><span class="kick">📚 Pendidikan Pancasila • Kelas IV SD</span><h1 class="ttl">KEHIDUPAN BERMASYARAKAT<em>DI SEKITARKU</em></h1><p class="sub">Petualangan Bangjack di Kampung Pancasila</p><div class="chips">' +
          chips +
          "</div></div>" +
          sceneHero() +
          "</div>" +
          '<div class="card c">' +
          bub(
            "semangat",
            "Halo! Aku Bangjack, pemandu petualanganmu. Ayo jelajahi kampung kita dan jadi Bintang Kampung! Siapa kamu hari ini?",
          ) +
          '<div class="row" style="justify-content:center"><button class="btn go big" onclick="go(\'siswa\')">🎒 Mode Siswa</button><button class="btn warn big" onclick="go(\'guru\')">🧑‍🏫 Mode Guru</button></div>' +
          (DB.note ? '<p class="meta">' + DB.note + "</p>" : "") +
          "</div>" +
          vidCard(
            "🎬 Video 1: Animasi Pesan Moral",
            "Animasi dengan pesan moral. Perhatikan pesan baik apa yang bisa kamu tiru!",
            VID,
          ) +
          vidCard(
            "🎞️ Video 2: Penjelasan Materi",
            "Video penjelasan materi Kehidupan Bermasyarakat di Sekitarku",
            VID2,
          ) +
          '<div class="card"><h2>📜 Petunjuk Bermain</h2><ol class="steps">' +
          st +
          '</ol><h3 style="margin-top:14px">Tiga tempat yang akan kamu kunjungi</h3><div class="grid">' +
          trip +
          '</div><div class="tile" style="margin-top:12px">🎵 <b>Musik:</b> tekan tombol 🎵 di pojok kanan bawah untuk menyalakan atau mematikan musik kapan saja.</div><p class="c" style="margin:10px 0 0"><button class="btn go big" onclick="go(\'siswa\')">🎒 Aku siap, ayo mulai!</button></p></div>'
        );
      }

      /* ===== MUSIK LATAR (dibuat langsung oleh browser, tanpa file audio) ===== */
      const MUS = {
        ctx: null,
        m: null,
        nb: null,
        on: false,
        ever: false,
        tm: null,
        st: 0,
        nt: 0,
        wasOn: false,
        BPM: 104,
        F: [
          261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880,
        ],
        MEL: [
          5, -1, 7, 8, 7, -1, 5, -1, 6, -1, 8, 9, 8, -1, 6, -1, 4, -1, 5, 6, 5,
          -1, 4, -1, 5, 6, 7, -1, 6, 5, 3, -1, 5, -1, 7, 8, 9, -1, 8, 7, 8, -1,
          7, 6, 7, -1, 5, -1, 6, 7, 8, -1, 7, 6, 5, -1, 5, -1, 3, -1, 5, -1, -1,
          -1,
        ],
        ROOT: [130.81, 98, 110, 87.31, 130.81, 98, 87.31, 130.81],
        start() {
          try {
            if (!this.ctx) {
              const A = window.AudioContext || window.webkitAudioContext;
              if (!A) return;
              const c = (this.ctx = new A()),
                k = c.createDynamicsCompressor(),
                g = c.createGain();
              g.gain.value = 0.5;
              g.connect(k);
              k.connect(c.destination);
              this.m = g;
              const b = (this.nb = c.createBuffer(
                  1,
                  Math.floor(c.sampleRate * 0.5),
                  c.sampleRate,
                )),
                d = b.getChannelData(0);
              for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            this.ctx.resume();
            this.ever = true;
            if (!this.on) {
              this.on = true;
              this.st = 0;
              this.nt = this.ctx.currentTime + 0.08;
              this.tm = setInterval(() => this.tick(), 60);
            }
            document.body.classList.add("mon");
          } catch (e) {}
          this.ui();
        },
        stop() {
          this.on = false;
          clearInterval(this.tm);
          this.tm = null;
          document.body.classList.remove("mon");
          this.ui();
        },
        toggle() {
          this.on ? this.stop() : this.start();
        },
        ui() {
          const b = document.getElementById("mbtn");
          if (!b) return;
          b.textContent = this.on
            ? "🎵 Musik: Nyala"
            : this.ever
              ? "🔇 Musik: Mati"
              : "🎵 Putar Musik";
          b.setAttribute("aria-pressed", String(this.on));
          b.classList.toggle("pulse", !this.ever);
        },
        tick() {
          const c = this.ctx;
          while (this.nt < c.currentTime + 0.25) {
            this.play(this.st % 64, this.nt);
            this.nt += 60 / this.BPM / 2;
            this.st++;
          }
        },
        play(s, t) {
          const b = s % 8,
            bar = s >> 3,
            n = this.MEL[s];
          if (n >= 0) {
            this.pluck(this.F[n], t, 0.3, 0.18);
            this.pluck(this.F[n], t + 0.13, 0.12, 0.08);
          }
          if (b === 0 || b === 4) {
            this.bass(this.ROOT[bar], t, 1);
            this.kick(t);
          }
          if (b === 2 || b === 6) {
            this.bass(this.ROOT[bar] * 1.5, t, 0.55);
            this.block(t);
          }
          this.hat(t, b % 2 ? 0.6 : 0.3);
        },
        env(o, t, v, d) {
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(v, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d);
          o.connect(g);
          g.connect(this.m);
          o.start(t);
          o.stop(t + d + 0.05);
        },
        osc(ty, f, t, v, d) {
          const o = this.ctx.createOscillator();
          o.type = ty;
          o.frequency.value = f;
          this.env(o, t, v, d);
        },
        pluck(f, t, v, d) {
          this.osc("triangle", f, t, v, d + 0.35);
          this.osc("sine", f * 2, t, v * 0.35, d + 0.2);
        },
        bass(f, t, k) {
          this.osc("sine", f, t, 0.55 * k, 0.32);
          this.osc("triangle", f * 2, t, 0.12 * k, 0.2);
        },
        kick(t) {
          const o = this.ctx.createOscillator();
          o.type = "sine";
          o.frequency.setValueAtTime(150, t);
          o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
          this.env(o, t, 0.7, 0.2);
        },
        block(t) {
          this.osc("triangle", 950, t, 0.16, 0.07);
        },
        hat(t, v) {
          const c = this.ctx,
            s = c.createBufferSource(),
            f = c.createBiquadFilter(),
            g = c.createGain();
          s.buffer = this.nb;
          f.type = "highpass";
          f.frequency.value = 7000;
          g.gain.setValueAtTime(0.07 * v, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
          s.connect(f);
          f.connect(g);
          g.connect(this.m);
          s.start(t);
          s.stop(t + 0.06);
        },
      };
      function firstTap(e) {
        if (MUS.ever) return;
        if (e.target && e.target.closest && e.target.closest("#mbtn")) return;
        MUS.start();
      }
      document.addEventListener("click", firstTap, true);
      document.addEventListener(
        "keydown",
        (e) => {
          if (e.key === "Enter" || e.key === " ") firstTap(e);
        },
        true,
      );
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          MUS.wasOn = MUS.on;
          if (MUS.on) MUS.stop();
        } else if (MUS.wasOn) {
          MUS.wasOn = false;
          MUS.start();
        }
      });
      window.addEventListener("blur", () =>
        setTimeout(() => {
          const a = document.activeElement;
          if (a && a.tagName === "IFRAME" && MUS.on) MUS.stop();
        }, 0),
      );

      DB.init().then(() => render());
    </script>
  </body>
